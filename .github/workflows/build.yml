name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK and write version.json
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FireHome.apk
          code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          name=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "{\"versionCode\": $code, \"versionName\": \"$name\"}" > version.json
          cat version.json

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FireHome.apk version.json --title "Fire Home (latest build)" --notes "Built from ${{ github.sha }}"
